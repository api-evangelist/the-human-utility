name: The Human Utility
description: >-
  The Human Utility (formerly the Detroit Water Project) is a Y Combinator-backed
  not-for-profit organization founded in 2014 by Tiffani Ashley Bell whose mission
  is to preserve human dignity by increasing water affordability for families across
  the United States. It matches families who are behind on their water bills with
  donors who want to help, paying utility companies directly on their behalf through
  crowdfunded donations, community-building, and policy action. Operating in Detroit,
  Baltimore, and dozens of other cities, it has helped thousands of households avoid
  water shutoffs. The Human Utility runs a public-facing web application for donors
  and recipients rather than a developer-facing API product; its source code lives in
  the humanutility GitHub organization. This profile was surfaced as a Y Combinator
  portfolio company and enriched with identity and link details; no public API surface
  was found.
